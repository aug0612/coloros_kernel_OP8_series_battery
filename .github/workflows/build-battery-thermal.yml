name: OnePlus 8 Pro - ColorOS 16 - Battery & Thermal Kernel

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: 'Inclure KernelSU (root) ?'
        required: true
        type: boolean
        default: true

jobs:
  build-kernel:
    name: OnePlus 8 Pro (instantnoodlep) - Battery & Thermal - ${{ matrix.author }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - repo: "https://github.com/JackA1ltman/android_kernel_oneplus_sm8250_los_noksu.git"
            command: "NM=llvm-nm OBJDUMP=llvm-objdump STRIP=llvm-strip"
            branch: "upstream-original"
            name: "battery-thermal"
            author: "toraidl-base"
            device: "oneplus8pro-coloros16"
      fail-fast: false
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Nettoyage de l'espace disque du runner
        run: |
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Installation des paquets nécessaires
        run: |
          sudo apt update
          sudo apt install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler cpio coccinelle -y
          sudo apt-get install zstd libc6 binutils libc6-dev-i386 gcc g++ p7zip p7zip-full -y

          curl -C - --progress-bar -L http://launchpadlibrarian.net/580830584/libtinfo5_6.3-2_amd64.deb -o libtinfo5.deb
          sudo apt install ./libtinfo5.deb
          rm -f libtinfo5.deb

          sudo apt install python3 -y
          sudo rm -rf /usr/bin/python
          sudo ln -s /usr/bin/python3 /usr/bin/python

      - name: Récupération des outils de compilation (GCC + Clang)
        run: |
          cd $GITHUB_WORKSPACE
          git clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git" -b "android12L-release" gcc-64 --depth=1
          git clone "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git" -b "android12L-release" gcc-32 --depth=1

          curl -C - --progress-bar -L "https://github.com/ZyCromerZ/Clang/releases/download/10.0.1-20220724-release/Clang-10.0.1-20220724.tar.gz" -o "clang-custom.tar.gz"
          mkdir clang-custom
          tar -C clang-custom/ -zxf clang-custom.tar.gz

      - name: Configuration de ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-kernel-battery-thermal
          max-size: 2G

      - name: Récupération des sources du kernel
        run: |
          cd $GITHUB_WORKSPACE
          git clone -b "${{ matrix.branch }}" "${{ matrix.repo }}" device_kernel --depth 1

          sed -i '$a\CONFIG_TECHPACK_CAMERA_ONEPLUS=y' device_kernel/arch/arm64/configs/vendor/kona-perf_defconfig
          sed -i '/-include oplus_native_features.mk/i\export BRAND_SHOW_FLAG=oneplus' device_kernel/OplusKernelEnvConfig.mk

          if [[ "${{ inputs.ksu }}" == "true" ]]; then
            echo "KSU_NAME=-ksu" >> $GITHUB_ENV
            cd device_kernel
            curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
            echo "CONFIG_KSU=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig
            echo "CONFIG_KSU_MANUAL_HOOK=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig
            echo "CONFIG_KALLSYMS=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig
            echo "CONFIG_KALLSYMS_ALL=y" >> ./arch/arm64/configs/vendor/kona-perf_defconfig
            curl -LSs "https://raw.githubusercontent.com/JackA1ltman/NonGKI_Kernel_Build_2nd/refs/heads/mainline/Patches/syscall_hook_patches.sh" | bash -s
          else
            echo "KSU_NAME=" >> $GITHUB_ENV
          fi

      - name: Application du tuning batterie & thermique (defconfig)
        run: |
          cd $GITHUB_WORKSPACE
          echo "" >> device_kernel/arch/arm64/configs/vendor/kona-perf_defconfig
          echo "# --- Battery & Thermal tuning (fork perso) ---" >> device_kernel/arch/arm64/configs/vendor/kona-perf_defconfig
          cat config-fragments/battery-thermal.config >> device_kernel/arch/arm64/configs/vendor/kona-perf_defconfig

      - name: Application du tuning thermique (trip points DTS)
        run: |
          cd $GITHUB_WORKSPACE
          DTS=device_kernel/arch/arm64/boot/dts/vendor/qcom/kona-thermal.dtsi
          if [ -f "$DTS" ]; then
            bash scripts/apply-dts-thermal-tuning.sh "$DTS"
          else
            echo "⚠️ kona-thermal.dtsi introuvable à l'emplacement attendu, patch DTS ignoré (voir config-fragments/THERMAL_TUNING.md)."
          fi

      - name: Récupération de l'outil de packaging AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          git clone "https://github.com/osm0sis/AnyKernel3.git" -b "master" Anykernel3
          cd Anykernel3
          git checkout dca9dc370838d919d56c1f59ec78b27a14a72c68
          cd ../

      - name: Compilation du kernel
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          export PATH=$GITHUB_WORKSPACE/clang-custom/bin:$PATH

          make CC="ccache clang" O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=oneplus ${{ matrix.command }} CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- vendor/kona-perf_defconfig
          make -j$(nproc --all) CC="ccache clang" CLANG_TRIPLE=aarch64-linux-gnu- BRAND_SHOW_FLAG=oneplus ${{ matrix.command }} STRIP=llvm-strip CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-64/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-32/bin/arm-linux-androideabi- O=out ARCH=arm64 2>&1 | tee error.log

      - name: Préparation d'AnyKernel3
        run: |
          cd $GITHUB_WORKSPACE/device_kernel
          sed -i 's/ExampleKernel by osm0sis @ xda-developers/Battery-Thermal Kernel OP8 Pro (fork perso)/g' Anykernel3/anykernel.sh
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' Anykernel3/anykernel.sh
          sed -i 's!BLOCK=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!BLOCK=auto;!g' Anykernel3/anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0;/is_slot_device=auto;/g' Anykernel3/anykernel.sh

      - name: Injection du script de tuning au boot (ramdisk)
        run: |
          cd $GITHUB_WORKSPACE
          bash scripts/apply-ramdisk-tuning.sh device_kernel/Anykernel3

      - name: Création du flashable zip (sans DTB — OnePlus 8 / 8 Pro / 8T)
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")
          cd $GITHUB_WORKSPACE/device_kernel
          mkdir -p tmp
          cp -fp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/Image tmp
          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ matrix.device }}-${{ matrix.name }}-$TIME${{ env.KSU_NAME }}.zip
          rm -rf tmp
          echo "PACK_NAME=${{ matrix.device }}-${{ matrix.name }}-$TIME${{ env.KSU_NAME }}.zip" >> $GITHUB_ENV

      - name: Création du flashable zip (avec DTB)
        run: |
          TIME=$(date +"%Y%m%d%H%M%S")
          cd $GITHUB_WORKSPACE/device_kernel
          mkdir -p tmp
          cp -fp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/Image tmp
          cp -fp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/dtb tmp
          cp -fp $GITHUB_WORKSPACE/device_kernel/out/arch/arm64/boot/dtbo.img tmp
          cp -rp ./Anykernel3/* tmp
          cd tmp
          7za a -mx9 tmp.zip *
          cd ..
          cp -fp tmp/tmp.zip ${{ matrix.device }}-${{ matrix.name }}-$TIME${{ env.KSU_NAME }}-DTB.zip
          rm -rf tmp
          echo "PACK_NAME_DTB=${{ matrix.device }}-${{ matrix.name }}-$TIME${{ env.KSU_NAME }}-DTB.zip" >> $GITHUB_ENV

      - name: Upload des artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ matrix.device }}-${{ matrix.name }}
          path: |
            device_kernel/${{ env.PACK_NAME }}
            device_kernel/${{ env.PACK_NAME_DTB }}
